[build-system]
requires = ["setuptools==71.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RPP"
version = "1.9.0"
description = "RAPAS Photometry pipeline"
readme = "README.md"
requires-python = ">=3.12,<4"
license = {text = "MIT"}
authors = [
    {name = "Pier-Francesco Rocci"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "setuptools==71.0.0",

    # Core scientific packages
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.0.6",
    
    # Astronomy
    "astropy==8.0.2",
    "astropy-iers-data==0.2026.10.12.1.3.27",
    "astropy_healpix==2.0.1",
    "astroquery==0.4.11",
    "astroscrappy==1.3.0",
    "photutils==3.1.1",
    "scikit-image==0.26.0",
    "stdpipe==0.4.1",
    "sep==1.4.1",
    "sep-pjw==1.3.8",
    "regions==0.13",
    "reproject==0.21.0",
    "pyvo==1.9.1",
    
    # Visualization
    "matplotlib==3.11.2",
    "altair==6.3.0",
    
    # Backend (FastAPI)
    "anyio==4.15.1",
    "fastapi==0.143.3",
    "starlette==1.8.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.5",
    "werkzeug==3.1.9",
    "uvicorn==0.54.0",
    "httptools==0.9.0",

    # Backend (legacy Flask compatibility)
    "flask==3.1.3",
    "flask-cors==6.0.5",

    # Frontend (Streamlit)
    "streamlit==1.66.0",
    
    # API/Data validation
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "email-validator==2.3.0",
    "annotated-types==0.8.0",
    "annotated-doc==0.0.5",
    
    # HTTP/Requests
    "requests==2.34.2",
    "certifi==2026.10.18",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "urllib3==2.8.0",
    
    # Time/Date
    "python-dateutil==2.9.0.post0",
    "pytz==2026.5",
    "tzdata==2026.5",
    
    # Astronomy utilities
    "pyerfa==2.0.1.5",
    "pyFFTW==0.15.1",
    "sip_tpv==1.1",
    "statsmodels==0.15.0",
    "tqdm==4.70.1",
    
    # Image processing
    "imageio==2.38.1",
    "pillow==12.3.0",
    "tifffile==2026.10.15",
    "lazy_loader==0.6",
    "networkx==3.7",
    
    # Matplotlib dependencies
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.67.0",
    "kiwisolver==1.5.1",
    
    # Core utilities
    "packaging==26.3",
    "pyparsing==3.3.3",
    "sniffio==1.3.1",
    "typing_extensions==4.16.0",
    "PyYAML==6.0.3",
    "MarkupSafe==3.0.4",
    "toml==0.10.2",
    "tomli==2.5.0",
    
    # Additional dependencies
    "click==8.5.0",
    "h11==0.16.0",
    "Jaraco.classes==3.4.0",
    "jaraco.context==6.1.2",
    "jaraco.functools==4.6.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "more-itertools==11.2.1",
    "Pygments==2.21.0",
    "Referencing==0.37.0",
    "rpds-py==2026.9.1",
    "tenacity==9.2.1",
    "typing-inspection==0.4.4",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.11.6",
    "pytest~=9.1.1",
    "httpx==0.28.1",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "pip-upgrade-all==0.1.6",
    "sphinx_rtd_theme",
    "sphinx"
]

build = [
    "cx_Freeze==8.7.2",
    "cx_Logging==3.2.1",
]

[project.urls]
"Homepage" = "https://github.com/pierfra-rocci/rpp"
"Bug Tracker" = "https://github.com/pierfra-rocci/rpp/issues"

[project.scripts]
pfr = "run_frontend:main"

[tool.setuptools]
packages = ["src", "api", "pages"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    'ignore:pkg_resources is deprecated as an API\..*:DeprecationWarning',
]

[tool.isort]
profile = "black"
line_length = 88